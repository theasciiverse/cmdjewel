name: Build

on: [push]
jobs:
  build:
    runs-on: codeberg-medium
    container:
      image: docker.io/rust:latest
    steps:
      - run: git clone https://codeberg.org/pastthepixels/cmdjewel .
      # Need MinGW for Windows, Clang for building it2play, and ALSA for Linux audio...
      - name: Install MinGW and Clang and ALSA
        run: apt update && apt install g++-mingw-w64-x86-64 clang libasound2-dev -y
      # Finally we can start building!!
      - name: Build for Windows x64
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo build --target=x86_64-pc-windows-gnu --release
      - name: Build for Linux x64
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --target=x86_64-unknown-linux-gnu --release
      # Upload builds!
      - name: (sigh) Install node
        run: apt install nodejs -y
      - uses: actions/upload-artifact@v3
        with:
          name: build_x86-pc-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/cmdjewel.exe
      - uses: actions/upload-artifact@v3
        with:
          name: cmdjewel_x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/cmdjewel

    # Well, now we have to build cmdjewel for MacOS. Strap tight. This is going to be hard.
    build-macos:
      runs-on: codeberg-medium
      container:
        image: multiarch/crossbuild:latest
      steps:
        # Install deps
        - name: Install Rust
          run: |
            apt update && apt install rustup -y
            rustup default stable
            rustup target add aarch64-apple-darwin
        - name: Build for MacOS aarch64
          run: cargo build --target=aarch64-apple-darwin --release
        # Upload
        - uses: actions/upload-artifact@v3
          with:
            name: build-macos
            path: target/aarch64-apple-darwin/release/cmdjewel
