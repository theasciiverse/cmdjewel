[package]
name = "cmdjewel"
description = "A match-3 game that runs in your terminal."
version = "0.3.0"
edition = "2024"
keywords = ["bejeweled_clone", "match_3"]
categories = ["games"]
readme = "../README.md"
license = "GPL-3.0-only"

[dependencies]
cursive = "0.21.1"
cpal = { version = "0.16.0", optional = true }
it2play-rs = { version = "0.1.3", optional = true }
rand = "0.9.2"
dirs = "6.0.0"
toml = "0.9.5"
toml_edit = { version = "0.23.4", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
cmdjewel_core = { path = "../cmdjewel_core", version = "0.3.0" }

[features]
default = ["sound"]
sound = ["dep:cpal", "dep:it2play-rs"]
